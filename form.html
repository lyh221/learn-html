<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form요소</title>
  </head>
  <body>
    <h2>Form 요소 살펴보기</h2>

    <!-- 로그인 박스 -->
    <form>
      <h5>로그인 해주세요</h5>
      <div>
        ID :
        <input
          type="text"
          name="userid"
          placeholder="id를 입력하세요"
          required
        />
      </div>
      <div>
        Password :
        <input
          type="password"
          name="password"
          placeholder="패스워드를 입력하세요"
          required
        />
      </div>
      <input type="submit" />
    </form>
  </body>
</html>
